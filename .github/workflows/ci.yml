name: MLOps CI/CD Pipeline - Quality Gates, Tests & Container Verification

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality-gate-and-test:
    name: Code Quality, Model Gating & Behavioral Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Verify Backend Import Integrity
        run: |
          python -c "import backend.main; import backend.mlops.service; print('FastAPI and MLOps service imported successfully!')"

      - name: Verify MLOps Champion Model & Behavioral Gates
        run: |
          python -c "
          from backend.mlops.service import mlops_service
          # Test Champion Model Inference
          test_skills = {k: 5.0 for k in ['ai_ml', 'data_science', 'software_development', 'programming_skills', 'cyber_security', 'distributed_computing_systems', 'database_fundamentals', 'software_engineering', 'troubleshooting_skills', 'technical_communication']}
          res = mlops_service.predict_student_assessment(test_skills, 'Software Developer')
          assert res['assessment_pass'] is True, 'High profile must pass gating!'
          assert res['confidence_percentage'] >= 50.0, 'Pass confidence must be >= 50%!'

          # Test Boundary Extremes (0s must fail)
          zero_skills = {k: 0.0 for k in test_skills}
          res_zero = mlops_service.predict_student_assessment(zero_skills, 'Software Developer')
          assert res_zero['assessment_pass'] is False, 'Zero profile must fail gating!'
          print('All behavioral tests and model gating passed!')
          "

  docker-build-and-verify:
    name: Docker Containerization Build & Health Verification
    needs: quality-gate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ai-technical-skill-assistant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test Docker Container Runtime
        run: |
          docker run -d --name test_api -p 8005:8005 ai-technical-skill-assistant:latest
          sleep 10
          docker ps
          curl --retry 5 --retry-delay 2 --retry-connrefused --fail http://localhost:8005/health || exit 1
          docker stop test_api
          docker rm test_api
          echo "Docker container healthcheck verified successfully!"
